<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Admin - BKPSDM Dumai</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="login-page">

    <div class="bg-shape bg-shape-1"></div>
    <div class="bg-shape bg-shape-2"></div>

    <div class="login-container">
        <div class="login-card glass-panel">
            <div class="login-header">
                <div class="logo-icon-wrapper">
                    <img src="assets/img/logo-bkpsdm.jpg" alt="Logo BKPSDM Dumai" class="logo-img">
                </div>
                <h2>Login Admin</h2>
                <p>Masuk ke Portal Kepegawaian BKPSDM Dumai</p>
            </div>

            <!-- Pesan Error -->
            <div class="error-msg" id="loginError">
                <i class="ph-fill ph-warning-circle"></i>
                <span>Username atau password salah. Coba lagi.</span>
            </div>

            <form id="loginForm" class="login-form" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label>Username</label>
                    <div class="input-icon">
                        <i class="ph ph-user"></i>
                        <input type="text" id="loginUsername" placeholder="Masukkan username" required autocomplete="username">
                    </div>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <div class="input-icon">
                        <i class="ph ph-lock"></i>
                        <input type="password" id="loginPassword" placeholder="Masukkan password" required autocomplete="current-password">
                        <button type="button" class="toggle-password" onclick="togglePasswordVisibility()" title="Tampilkan password">
                            <i class="ph ph-eye" id="eyeIcon"></i>
                        </button>
                    </div>
                </div>

                <div class="hint-box">
                    <i class="ph ph-info"></i>
                    <span>Default: <strong>admin</strong> / <strong>admin123</strong></span>
                </div>

                <button type="submit" class="btn-primary w-full mt-2" id="btnLogin">
                    <span class="btn-text">Masuk <i class="ph-bold ph-sign-in"></i></span>
                    <span class="btn-loading" style="display:none;"><i class="ph ph-circle-notch spinning"></i> Memverifikasi...</span>
                </button>

                <div class="back-link">
                    <a href="index.html"><i class="ph ph-arrow-left"></i> Kembali ke Halaman Publik</a>
                </div>
            </form>
        </div>
    </div>

    <script src="auth.js"></script>
    <script>
        // Jika sudah login, langsung masuk
        if (getSession()) window.location.href = 'admin.html';

        function togglePasswordVisibility() {
            const input = document.getElementById('loginPassword');
            const icon = document.getElementById('eyeIcon');
            if (input.type === 'password') {
                input.type = 'text';
                icon.className = 'ph ph-eye-slash';
            } else {
                input.type = 'password';
                icon.className = 'ph ph-eye';
            }
        }

        // Patch loading button
        const _origHandleLogin = handleLogin;
        window.handleLogin = function(e) {
            const btn = document.getElementById('btnLogin');
            const btnText = btn.querySelector('.btn-text');
            const btnLoading = btn.querySelector('.btn-loading');
            btnText.style.display = 'none';
            btnLoading.style.display = 'inline-flex';
            _origHandleLogin(e);
            // Re-show text if login fails (after delay in auth.js)
            setTimeout(() => {
                btnText.style.display = 'inline-flex';
                btnLoading.style.display = 'none';
            }, 1200);
        };
    </script>
</body>
</html>
